<style>
/* ===================== هوية الألوان — مستوحاة من اللوجو ===================== */
:root{
  --sky:#0AA7EE;        /* أزرق اللوجو الفاتح  */
  --sky-d:#0089C9;
  --sky-soft:#E7F6FE;
  --navy:#123FA6;       /* أزرق اللوجو الغامق */
  --navy-d:#0D2F7E;
  --red:#E8262B;
  --green:#16A11A;
  --green-soft:#E7F7E8;
  --yellow:#FBCD08;
  --yellow-soft:#FFF6D6;

  --bg:#F3F7FB; --surface:#ffffff; --ink:#132441; --muted:#6C7A93;
  --line:#E3EAF3;
  --brand:var(--navy); --accent:var(--yellow); --ok:var(--green); --danger:var(--red);
  --shadow:0 1px 2px rgba(19,36,65,.05), 0 10px 26px -14px rgba(19,36,65,.22);
  --shadow-lg:0 20px 50px -20px rgba(19,36,65,.35);
  --radius:16px; --maxw:1340px;
  --hdr-h:64px;
}
*{box-sizing:border-box}
/* html بالإنجليزية ليظهر شريط التمرير على اليمين، والمحتوى RTL */
html{direction:ltr; scrollbar-width:thin; scrollbar-color:#B9CBDF transparent; scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  direction:rtl;
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
/* شريط تمرير رفيع وخفيف */
::-webkit-scrollbar{width:8px; height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C2D2E4; border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--sky)}
img{max-width:100%; display:block}
button,input,select,textarea{font-family:inherit; font-size:inherit}
button{cursor:pointer; border:0; background:none; color:inherit}
a{color:inherit}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(12px,3vw,20px)}
.hidden{display:none !important}

/* ===================== الهيدر ===================== */
header{position:sticky; top:0; z-index:60; background:var(--surface); box-shadow:0 1px 0 var(--line), 0 6px 18px -14px rgba(19,36,65,.5)}
.hdr{display:flex; align-items:center; gap:10px; height:var(--hdr-h)}
.icobtn{
  width:42px; height:42px; border-radius:13px; flex:0 0 auto;
  display:grid; place-items:center; font-size:19px; color:var(--navy);
  background:var(--sky-soft); position:relative; transition:.15s;
}
.icobtn:hover{background:#D6EFFC}
.icobtn.burger{font-size:0}
.burger i{display:block; width:18px; height:2px; border-radius:2px; background:var(--navy); box-shadow:0 -6px 0 var(--navy), 0 6px 0 var(--navy)}
.brand{display:flex; align-items:center; gap:9px; min-width:0; flex:0 1 auto; text-decoration:none}
.brand img{height:42px; width:42px; object-fit:cover; border-radius:12px; box-shadow:0 1px 3px rgba(19,36,65,.12)}
.brand .txt{min-width:0}
.brand h1{font-size:16px; margin:0; font-weight:800; white-space:nowrap; color:var(--navy)}
.brand small{display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:-4px; white-space:nowrap}
.search{flex:1 1 220px; position:relative; min-width:0}
.search input{
  width:100%; padding:10px 40px 10px 14px; border-radius:13px; border:1px solid var(--line);
  background:#F6F9FC; color:var(--ink); outline:none; transition:.15s;
}
.search input::placeholder{color:#9AA8BC}
.search input:focus{background:#fff; border-color:var(--sky); box-shadow:0 0 0 3px rgba(10,167,238,.15)}
.search .ico{position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px}
.spacer{flex:1 1 auto}
.badge{
  position:absolute; top:-4px; inset-inline-start:-4px; min-width:19px; height:19px;
  border-radius:10px; background:var(--red); color:#fff; font-size:11px; font-weight:800;
  display:grid; place-items:center; padding:0 5px; border:2px solid #fff;
}
.icobtn.cart{background:var(--navy); color:#fff}
.icobtn.cart:hover{background:var(--navy-d)}

/* ===================== شريط الأقسام ===================== */
.catbar{background:linear-gradient(90deg,var(--navy),var(--sky)); position:relative}
.catbar .row{
  display:flex; gap:8px; overflow-x:auto; padding:9px clamp(12px,3vw,20px);
  scrollbar-width:none; cursor:grab; scroll-behavior:auto;
  max-width:var(--maxw); margin:0 auto;
}
.catbar .row.drag{cursor:grabbing; scroll-behavior:auto}
.catbar .row.drag .chip{pointer-events:none}
.catbar .row::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap; padding:7px 14px; border-radius:999px; font-size:13.5px; font-weight:500;
  background:rgba(255,255,255,.16); color:#fff; transition:.15s; flex:0 0 auto; user-select:none;
}
.chip:hover{background:rgba(255,255,255,.3)}
.chip.on{background:#fff; color:var(--navy); font-weight:800}
.chip.hot{background:var(--yellow); color:#4A3A00; font-weight:800}
.chip.hot.on{background:#fff; color:#B58900}

/* ===================== البانر ===================== */
.banner{
  margin:16px 0 2px; padding:15px 20px; border-radius:var(--radius);
  background:linear-gradient(115deg,var(--navy),var(--sky) 88%);
  color:#fff; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
}
.banner .big{font-size:26px}
.banner b{display:block; font-size:16px}
.banner span{font-size:13px; opacity:.88}

/* ===================== شريط الفلاتر ===================== */
.toolbar{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:14px 0 10px; position:sticky; top:var(--hdr-h); z-index:40;
  background:linear-gradient(var(--bg) 78%, transparent);
}
.sel{
  padding:8px 12px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); font-size:13.5px; color:var(--ink); outline:none; max-width:210px;
}
.sel:focus{border-color:var(--sky)}
.pill{
  padding:8px 13px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); font-size:13.5px; font-weight:500;
}
.pill.on{background:var(--navy); color:#fff; border-color:var(--navy)}
.count{margin-inline-start:auto; color:var(--muted); font-size:13px}

/* ===================== الشبكة والبطاقات ===================== */
.grid{display:grid; gap:14px; padding-bottom:40px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid.list{grid-template-columns:1fr}
.card{
  background:var(--surface); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); display:flex; flex-direction:column;
  border:1px solid transparent; transition:.18s;
}
.card:hover{transform:translateY(-3px); border-color:#CFE6F6; box-shadow:var(--shadow-lg)}
.thumb{position:relative; aspect-ratio:1/1; background:#F1F5FA; cursor:pointer; overflow:hidden}
.thumb img{width:100%; height:100%; object-fit:cover; transition:.35s}
.card:hover .thumb img{transform:scale(1.06)}
.tags{position:absolute; top:8px; inset-inline-start:8px; display:flex; flex-direction:column; gap:5px; align-items:flex-start}
.tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--yellow); color:#4A3A00}
.tag.new{background:var(--green); color:#fff}
.tag.out{background:#5A6577; color:#fff}
.fav{
  position:absolute; top:8px; inset-inline-end:8px; width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.94); display:grid; place-items:center; font-size:15px; color:#BCC6D6;
  box-shadow:0 2px 8px rgba(19,36,65,.15);
}
.fav.on{color:var(--red)}
.body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:7px; flex:1}
.code{font-size:11.5px; color:var(--muted); font-family:ui-monospace,monospace; letter-spacing:.3px}
.name{font-size:14px; font-weight:500; line-height:1.45; min-height:40px; cursor:pointer;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.prices{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.p-main{font-size:18px; font-weight:800; color:var(--navy)}
.p-cur{font-size:12px; font-weight:500; color:var(--muted)}
.p-sub{font-size:11.5px; color:var(--green); background:var(--green-soft); padding:2px 7px; border-radius:6px; font-weight:700}
.carton{font-size:12px; color:var(--muted)}
.carton b{color:var(--ink); font-weight:700}
.qbtns{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:auto}
.qb{padding:6px 2px; border-radius:9px; background:var(--sky-soft); font-size:12px; font-weight:800; color:var(--navy); transition:.12s}
.qb:hover{background:var(--sky); color:#fff}
.qb.ctn{background:var(--yellow-soft); color:#8A6D00}
.qb.ctn:hover{background:var(--yellow); color:#4A3A00}
.qb.off{opacity:.42}
.qb.off:hover{background:var(--sky-soft); color:var(--navy)}
.addrow{display:flex; gap:6px}
.add{flex:1; padding:9px; border-radius:11px; background:var(--navy); color:#fff; font-weight:800; font-size:13.5px; transition:.15s}
.add:hover{background:var(--navy-d)}
.add.in{background:var(--green)}
.qty-in{width:62px; padding:9px 6px; border-radius:11px; border:1px solid var(--line); text-align:center; font-weight:700; outline:none}
.qty-in:focus{border-color:var(--sky)}

.grid.list .card{flex-direction:row}
.grid.list .thumb{width:150px; aspect-ratio:1/1; flex-shrink:0}
.grid.list .body{flex-direction:row; flex-wrap:wrap; align-items:center; gap:14px}
.grid.list .name{min-height:0; flex:1; -webkit-line-clamp:1}
.grid.list .qbtns{grid-template-columns:repeat(4,54px); margin:0}
.grid.list .addrow{width:auto}
.grid.list .add{padding:9px 18px}

/* ===================== صفوف الأقسام المتحركة (عرض الكل) ===================== */
.sections{padding-bottom:40px}
.sec{margin-bottom:26px}
.sec-h{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.sec-h .ic{width:34px; height:34px; border-radius:11px; background:var(--sky-soft); display:grid; place-items:center; font-size:17px; flex:0 0 auto}
.sec-h b{font-size:16.5px; color:var(--navy)}
.sec-h .n{font-size:12.5px; color:var(--muted); font-weight:500}
.sec-h .more{margin-inline-start:auto; font-size:13px; font-weight:700; color:var(--sky-d); padding:6px 12px; border-radius:10px; background:var(--sky-soft); flex:0 0 auto}
.sec-h .more:hover{background:var(--sky); color:#fff}
.rail{
  display:flex; gap:12px; overflow-x:auto; padding:4px 2px 10px;
  scrollbar-width:none; cursor:grab; scroll-behavior:auto;
}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing}
.rail.drag .card{pointer-events:none}
.rail .card{flex:0 0 186px; width:186px}
.rail .name{min-height:38px; font-size:13.5px}

/* ===================== الحالات ===================== */
.state{padding:70px 20px; text-align:center; color:var(--muted)}
.state .em{font-size:46px; margin-bottom:10px}
.state b{display:block; color:var(--ink); font-size:17px; margin-bottom:6px}
.skel{background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow)}
.skel .a{aspect-ratio:1/1; background:linear-gradient(90deg,#EEF3F9,#E1EAF4,#EEF3F9); background-size:200% 100%; animation:sh 1.3s infinite}
.skel .b{height:13px; margin:12px; border-radius:6px; background:#EEF3F9}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===================== الأدراج ===================== */
.scrim{position:fixed; inset:0; background:rgba(12,22,42,.5); backdrop-filter:blur(2px); z-index:80; opacity:0; pointer-events:none; transition:.22s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; height:100dvh; width:min(420px,100%);
  background:var(--bg); z-index:90; display:flex; flex-direction:column;
  transition:transform .26s cubic-bezier(.4,0,.2,1); visibility:hidden;
  box-shadow:var(--shadow-lg);
}
.drawer.d-left{left:0; transform:translateX(-102%)}
.drawer.d-right{right:0; transform:translateX(102%)}
.drawer.on{transform:none; visibility:visible}
.dhead{
  padding:14px 16px; background:var(--navy); color:#fff; display:flex;
  align-items:center; justify-content:space-between; gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.dhead b{font-size:16.5px}
.dbody{flex:1; overflow:auto; padding:14px 16px 16px; overscroll-behavior:contain}
.dfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}

/* قائمة الأقسام الجانبية */
.navlist{display:flex; flex-direction:column; gap:4px}
.navlist button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:start;
  padding:11px 12px; border-radius:12px; background:var(--surface); border:1px solid transparent;
  font-size:14px; font-weight:500; transition:.14s; box-shadow:0 1px 2px rgba(19,36,65,.04);
}
.navlist button:hover{border-color:#CFE6F6; background:#fff}
.navlist button.on{background:var(--navy); color:#fff}
.navlist button .ic{width:30px; height:30px; border-radius:9px; background:var(--sky-soft); display:grid; place-items:center; font-size:15px; flex:0 0 auto}
.navlist button.on .ic{background:rgba(255,255,255,.18)}
.navlist button .n{margin-inline-start:auto; font-size:12px; color:var(--muted); font-weight:700}
.navlist button.on .n{color:rgba(255,255,255,.8)}
.navsep{margin:12px 2px 6px; font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.3px}

.ci{display:flex; gap:11px; background:var(--surface); border-radius:13px; padding:10px; margin-bottom:10px; box-shadow:var(--shadow)}
.ci img{width:62px; height:62px; border-radius:10px; object-fit:cover; background:#F1F5FA; flex-shrink:0}
.ci .m{flex:1; min-width:0}
.ci .n{font-size:13.5px; font-weight:500; line-height:1.35}
.ci .c{font-size:11px; color:var(--muted); font-family:ui-monospace,monospace}
.stepper{display:flex; align-items:center; margin-top:6px; border:1px solid var(--line); border-radius:9px; width:fit-content; overflow:hidden}
.stepper button{width:28px; height:28px; background:#F2F7FB; font-weight:800; color:var(--navy)}
.stepper input{width:52px; height:28px; border:0; text-align:center; font-weight:700; outline:none}
.ci .t{text-align:end; display:flex; flex-direction:column; justify-content:space-between}
.ci .t b{font-size:14.5px; color:var(--navy); white-space:nowrap}
.ci .rm{color:var(--muted); font-size:16px}
.ci .rm:hover{color:var(--red)}

.field{margin-bottom:11px}
.field label{display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky)}

/* اجماليات السلة */
.totals{background:#F7FAFD; border:1px solid var(--line); border-radius:13px; padding:11px 12px; margin-bottom:11px}
.sumrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; color:var(--muted); margin-bottom:6px}
.sumrow b{color:var(--ink); font-weight:700}
.sumrow.vat b{color:var(--sky-d)}
.sumrow.grand{
  margin:9px 0 0; padding-top:9px; border-top:1px dashed var(--line);
  font-size:15px; color:var(--ink); font-weight:800;
}
.sumrow.grand b{font-size:19px; color:var(--navy)}
.wa{
  width:100%; padding:13px; border-radius:13px; background:#25d366; color:#08341b;
  font-weight:800; font-size:15.5px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.wa:hover{filter:brightness(.95)}
.ghost{
  width:100%; padding:10px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); font-weight:500; font-size:13.5px; margin-top:8px; color:var(--muted);
}
.ghost:hover{border-color:var(--sky); color:var(--navy)}
.note{font-size:11.5px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5}

/* ===================== نافذة الصنف ===================== */
.modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:16px}
.modal.on{display:flex}
.mbox{background:var(--bg); border-radius:20px; width:min(880px,100%); max-height:92dvh; overflow:auto; box-shadow:var(--shadow-lg); position:relative}
.mclose{position:absolute; top:12px; inset-inline-start:12px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.95); font-size:18px; z-index:2; box-shadow:var(--shadow)}
.mgrid{display:grid; grid-template-columns:1fr 1fr; min-width:0}
.mimg{background:#fff; aspect-ratio:1/1}
.mimg img{width:100%; height:100%; object-fit:contain}
.minfo{padding:22px; display:flex; flex-direction:column; gap:12px; min-width:0}
.minfo h2{margin:0; font-size:21px; line-height:1.4; overflow-wrap:anywhere}
.spec{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px}
.spec span{color:var(--muted); flex:0 0 auto}
.spec b{font-weight:700; text-align:end; min-width:0; overflow-wrap:anywhere}
@media(max-width:700px){ .mgrid{grid-template-columns:1fr} }

/* ===================== زر العودة لأعلى ===================== */
.totop{
  position:fixed; inset-inline-end:14px; bottom:calc(16px + env(safe-area-inset-bottom));
  width:42px; height:42px; border-radius:50%; background:var(--navy); color:#fff; font-size:17px;
  display:grid; place-items:center; box-shadow:var(--shadow-lg); z-index:70;
  opacity:0; pointer-events:none; transform:translateY(10px); transition:.22s;
}
.totop.on{opacity:.92; pointer-events:auto; transform:none}
.totop:hover{opacity:1; background:var(--sky)}

/* ===================== الفوتر ===================== */
footer{background:var(--navy); color:rgba(255,255,255,.75); padding:28px 0 34px; margin-top:20px; font-size:13px}
footer .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:22px}
footer b{color:#fff; display:block; margin-bottom:7px; font-size:14px}

/* ===================== الجوال ===================== */
@media(max-width:700px){
  :root{--hdr-h:106px}
  .hdr{height:auto; flex-wrap:wrap; padding-block:9px 10px; gap:8px}
  #btnFav{margin-inline-start:auto}
  .brand{flex:0 1 auto; min-width:0}
  .brand h1{overflow:hidden; text-overflow:ellipsis}
  .brand img{height:38px; width:38px}
  .brand h1{font-size:14.5px}
  .brand small{display:none}
  .search{order:5; flex:1 1 100%; min-width:0}
  .icobtn{width:40px; height:40px; border-radius:12px; font-size:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .rail .card{flex-basis:158px; width:158px}
  .sel{max-width:none; flex:1 1 44%; min-width:0}
  .count{flex-basis:100%; margin:2px 0 0}
  .grid.list .thumb{width:110px}
  .grid.list .body{flex-direction:column; align-items:stretch; gap:7px}
  .grid.list .qbtns{grid-template-columns:repeat(4,1fr)}
  .banner{padding:13px 15px; gap:11px; margin:12px 0 0}
  .banner .big{font-size:22px}
  .banner b{font-size:14.5px}
  .banner span{font-size:12.5px}
  .drawer{width:100%}
  .dbody{padding:12px 14px 14px}
  .dfoot{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .totop{width:38px; height:38px; inset-inline-end:10px}
}
@media(max-width:380px){
  .brand .txt{display:none}
}
</style>

};

/* ---------- قراءة CSV ---------- */
function parseCSV(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows) {
  if (!rows.length) return [];
  const h = rows[0].map(x => x.trim());
  return rows.slice(1).map(r => {
    const o = {}; h.forEach((k, i) => o[k] = (r[i] ?? '').trim()); return o;
  });
}
async function fetchSheet(name) {
  const r = await fetch(CSV(name));
  if (!r.ok) throw new Error('sheet ' + name + ' ' + r.status);
  return toObjects(parseCSV(await r.text()));
}

/* ---------- الفلترة ---------- */
function filtered(list) {
  let a = (list || ITEMS).slice();
  if (f.cat === '__offer') a = a.filter(i => i.offer);
  else if (f.cat === '__new') a = a.filter(i => i.isNew);
  else if (f.cat === '__fav') a = a.filter(i => favs.includes(i.code));
  else if (f.cat) a = a.filter(i => i.cat === f.cat);

  if (f.price) {
    const [lo, hi] = f.price.split('-').map(Number);
    a = a.filter(i => i.price >= lo && i.price < hi);
  }
  if (f.q) {
    const t = f.q.toLowerCase().trim();
    a = a.filter(i => (i.name + ' ' + i.code + ' ' + i.tags + ' ' + i.cat).toLowerCase().includes(t));
  }
  return sortList(a);
}
function sortList(a) {
  const s = f.sort;
  if (s === 'p-asc') a.sort((x, y) => x.price - y.price);
  else if (s === 'p-desc') a.sort((x, y) => y.price - x.price);
  else if (s === 'name') a.sort((x, y) => x.name.localeCompare(y.name, 'ar'));
  else if (s === 'code') a.sort((x, y) => x.code.localeCompare(y.code));
  else a.sort((x, y) => (x.ord - y.ord) || (y.offer - x.offer) || (y.isNew - x.isNew));
  return a;
}

/* ---------- تمرير تلقائي بطيء + سحب باليد ---------- */
let railTimers = [];
function stopRails() { railTimers.forEach(t => t.stop()); railTimers = []; }

function autoScroll(el, dir) {
  const SPEED = 0.30;                 // بطيء واحترافي
  const isRTL = getComputedStyle(el).direction === 'rtl';
  let d = dir, paused = false, idle = 0, raf = 0, visible = false;
  let pos = el.scrollLeft;            // نحتفظ بالموضع كعدد عشري لأن scrollLeft يُقرَّب

  const io = new IntersectionObserver(e => { visible = e[0].isIntersecting; }, { threshold: 0 });
  io.observe(el);

  const pause = () => { paused = true; idle = 0; };
  const resume = () => { paused = false; };
  el.addEventListener('pointerenter', pause);
  el.addEventListener('pointerleave', resume);
  el.addEventListener('pointerdown', pause);
  el.addEventListener('touchstart', pause, { passive: true });
  el.addEventListener('touchend', pause, { passive: true });
  el.addEventListener('wheel', pause, { passive: true });
  el.addEventListener('scroll', () => {           // مزامنة عند التمرير اليدوي
    if (Math.abs(el.scrollLeft - pos) > 2) pos = el.scrollLeft;
  }, { passive: true });

  function step() {
    raf = requestAnimationFrame(step);
    if (!visible) return;
    if (paused) { if (++idle > 170) paused = false; return; }   // يستأنف بعد ~3 ثوانٍ
    const max = el.scrollWidth - el.clientWidth;
    if (max < 8) return;
    const lo = isRTL ? -max : 0, hi = isRTL ? 0 : max;
    pos += SPEED * d;
    if (pos < lo) { pos = lo; d = -d; }
    else if (pos > hi) { pos = hi; d = -d; }
    el.scrollLeft = pos;
  }
  raf = requestAnimationFrame(step);
  railTimers.push({ stop() { cancelAnimationFrame(raf); io.disconnect(); } });
}

/* سحب أفقي بالماوس (اللمس يعمل أصلاً) */
function dragScroll(el) {
  let down = false, sx = 0, sl = 0, moved = 0, cap = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    down = true; moved = 0; cap = 0; sx = e.clientX; sl = el.scrollLeft;
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 5) {
      moved = 1; el.classList.add('drag');
      /* لا نلتقط المؤشر إلا بعد بدء السحب فعلياً حتى لا تُبتلع نقرات الأزرار */
      if (!cap) { cap = 1; try { el.setPointerCapture(e.pointerId); } catch (_) {} }
      el.scrollLeft = sl - dx;
    }
  });
  const up = e => {
    if (!down) return;
    down = false;
    setTimeout(() => { el.classList.remove('drag'); moved = 0; }, 0);
    if (cap) { try { el.releasePointerCapture(e.pointerId); } catch (_) {} cap = 0; }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = 0; } }, true);
  // عجلة الماوس تُمرّر أفقياً
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
}

function bindCards(root) {
  root.querySelectorAll('.card').forEach(c => {
    const code = c.dataset.code, it = ITEMS.find(x => x.code === code);
    if (!it) return;
    c.querySelectorAll('.js-open').forEach(e => e.onclick = () => openItem(code));
    c.querySelector('.js-fav').onclick = e => { e.stopPropagation(); toggleFav(code); };
    const qty = c.querySelector('.js-qty');
    c.querySelectorAll('.js-q').forEach(b => b.onclick = () => {
      if (b.dataset.q === 'ctn' && !it.pcs) { toast('لم يُحدَّد عدد الحبات بالكرتون لهذا الصنف'); return; }
      const v = b.dataset.q === 'ctn' ? it.pcs : +b.dataset.q;
      qty.value = v; addToCart(code, v);
    });
    c.querySelector('.js-add').onclick = () => addToCart(code, Math.max(1, +qty.value || 1));
  });
}

/* ---------- المفضلة ---------- */
function toggleFav(code) {
  const i = favs.indexOf(code);
  if (i > -1) favs.splice(i, 1); else favs.push(code);
  save('smiling_favs', favs); renderCats(); renderNav(); fillCatSelect(); render(); updBadges();
}

/* ---------- السلة ---------- */
function addToCart(code, qty) {
  const it = ITEMS.find(x => x.code === code); if (!it) return;
  cart[code] = { qty: Math.max(1, qty) };
  save('smiling_cart', cart); updBadges(); refreshCardStates(); renderCart();
  toast(`أُضيف ${qty} ${it.unit} من ${it.name}`);
}
function setQty(code, qty) {
  if (qty <= 0) delete cart[code]; else cart[code] = { qty };
  save('smiling_cart', cart); updBadges(); renderCart(); refreshCardStates();
}
/* تحديث أزرار البطاقات دون إعادة بناء الصفحة (حتى لا تتوقف الصفوف المتحركة) */
function refreshCardStates() {
  document.querySelectorAll('.card').forEach(c => {
    const inC = cart[c.dataset.code];
    const b = c.querySelector('.js-add'); if (!b) return;
    b.classList.toggle('in', !!inC);
    b.textContent = inC ? '✓ في السلة' : 'إضافة';
    const q = c.querySelector('.js-qty'); if (q && inC) q.value = inC.qty;
  });
}
function cartLines() {
  return Object.keys(cart).map(code => {
    const it = ITEMS.find(x => x.code === code); if (!it) return null;
    return { it, qty: cart[code].qty, total: it.price * cart[code].qty };
  }).filter(Boolean);
}
function cartTotals() {
  const L = cartLines();
  const sub = L.reduce((s, l) => s + l.total, 0);
  const rate = vatRate();
  const vat = sub * rate / 100;
  return { L, pieces: L.reduce((s, l) => s + l.qty, 0), sub, rate, vat, grand: sub + vat };
}
function updBadges() {
  const n = Object.keys(cart).length, b = document.getElementById('cartBadge');
  b.textContent = n; b.classList.toggle('hidden', !n);
  const fb = document.getElementById('favBadge');
  fb.textContent = favs.length; fb.classList.toggle('hidden', !favs.length);
}

  }
  body.innerHTML = L.map(l => `
    <div class="ci" data-c="${esc(l.it.code)}">

      <div class="m">
        <div class="n">${esc(l.it.name)}</div>
        <div class="c">${esc(l.it.code)} · ${money(l.it.price)} ${cur()}</div>

          <button class="js-inc">+</button>

      <div class="t"><button class="rm js-rm">✕</button><b>${money(l.total)}</b></div>
    </div>`).join('');

  body.insertAdjacentHTML('beforeend', `
    <div style="margin-top:14px;background:var(--surface);border-radius:13px;padding:13px;box-shadow:var(--shadow)">
      <div style="font-weight:800;margin-bottom:9px">بيانات الطلب</div>
      <div class="field"><label>اسم العميل / المحل</label><input id="cName" placeholder="مثال: مؤسسة الأمل للألعاب"></div>
      <div class="field"><label>رقم الجوال</label><input id="cPhone" type="tel" inputmode="tel" placeholder="05xxxxxxxx"></div>
      <div class="field"><label>المدينة</label><input id="cCity" placeholder="جدة / الدمام / …"></div>
      <div class="field"><label>طريقة الاستلام</label>
        <select id="cShip">
          <option>استلام من فرع جدة</option>
          <option>استلام من فرع الدمام</option>
          <option>شحن عبر شركة نقل</option>
        </select></div>
      <div class="field" style="margin-bottom:0"><label>ملاحظات</label><textarea id="cNote" rows="2" placeholder="أي ملاحظة على الطلب"></textarea></div>
    </div>`);

  body.querySelectorAll('.ci').forEach(el => {
    const c = el.dataset.c, q = cart[c].qty;
    el.querySelector('.js-inc').onclick = () => setQty(c, q + 1);
    el.querySelector('.js-dec').onclick = () => setQty(c, q - 1);
    el.querySelector('.js-n').onchange = e => setQty(c, Math.max(1, +e.target.value || 1));
    el.querySelector('.js-rm').onclick = () => setQty(c, 0);
  });

  const min = parseFloat(CONF['الحد_الادنى_للطلب']) || 0;
  const under = min > 0 && sub < min;

  foot.innerHTML = `
    <div class="totals">
      <div class="sumrow"><span>عدد الأصناف</span><b>${L.length}</b></div>
      <div class="sumrow"><span>إجمالي القطع</span><b>${pieces}</b></div>
      <div class="sumrow"><span>الإجمالي</span><b>${money(sub)} ${cur()}</b></div>
      <div class="sumrow vat"><span>ضريبة القيمة المضافة ${rate}%</span><b>+ ${money(vat)} ${cur()}</b></div>
      <div class="sumrow grand"><span>الإجمالي شامل الضريبة</span><b>${money(grand)} ${cur()}</b></div>
    </div>
    ${under ? `<div class="note" style="color:var(--danger)">الحد الأدنى للطلب ${money(min)} ${cur()}</div>` : ''}
    <button class="wa" id="sendWA" ${under ? 'disabled style="opacity:.5"' : ''}>
      <span style="font-size:18px">💬</span> إرسال الطلب على واتساب</button>
    <button class="ghost" id="copyOrder">📋 نسخ الطلب كنص</button>
    <button class="ghost" id="clearCart">🗑 تفريغ السلة</button>
    <div class="note">${esc(CONF['تنويه_الاسعار'] || '')}</div>`;

  document.getElementById('sendWA').onclick = sendWhatsApp;
  document.getElementById('copyOrder').onclick = () => {
    navigator.clipboard.writeText(orderText()).then(() => toast('تم نسخ الطلب ✓'));
  };
  document.getElementById('clearCart').onclick = () => {
    if (confirm('تفريغ السلة؟')) { cart = {}; save('smiling_cart', cart); updBadges(); renderCart(); refreshCardStates(); }
  };
}

function orderText() {
  const { L, pieces, sub, rate, vat, grand } = cartTotals();
  const g = id => (document.getElementById(id)?.value || '').trim();
  let t = `🧾 *طلبية جديدة — ${CONF['اسم_المتجر'] || 'الطفل المبتسم'}*\n`;
  t += `التاريخ: ${new Date().toLocaleDateString('en-GB')}\n`;
  if (g('cName')) t += `العميل: ${g('cName')}\n`;
  if (g('cPhone')) t += `الجوال: ${g('cPhone')}\n`;
  if (g('cCity')) t += `المدينة: ${g('cCity')}\n`;
  if (g('cShip')) t += `الاستلام: ${g('cShip')}\n`;
  t += `──────────────\n`;
  L.forEach((l, n) => {
    const ctn = l.it.pcs && l.qty % l.it.pcs === 0 ? ` (${l.qty / l.it.pcs} كرتون)` : '';
    t += `${n + 1}) ${l.it.code} — ${l.it.name}\n   ${l.qty} ${l.it.unit}${ctn} × ${money(l.it.price)} = *${money(l.total)}*\n`;
  });
  t += `──────────────\n`;
  t += `عدد الأصناف: ${L.length}\nإجمالي القطع: ${pieces}\n`;
  t += `الإجمالي: ${money(sub)} ${cur()}\n`;
  t += `ضريبة القيمة المضافة ${rate}%: ${money(vat)} ${cur()}\n`;
  t += `*الإجمالي شامل الضريبة: ${money(grand)} ${cur()}*\n`;
  if (g('cNote')) t += `\nملاحظات: ${g('cNote')}`;
  return t;
}

function sendWhatsApp() {
  const num = (CONF['رقم_واتساب'] || WHATSAPP_FALLBACK).replace(/\D/g, '');
  if (!num) { alert('لم يتم ضبط رقم الواتساب في صفحة الاعدادات'); return; }
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(orderText())}`, '_blank');
}

/* ---------- نافذة الصنف ---------- */
function openItem(code) {
  const i = ITEMS.find(x => x.code === code); if (!i) return;
  const showStock = yes(CONF['اظهار_المخزون']);
  document.getElementById('mbox').innerHTML = `
    <button class="mclose" onclick="closeModal()">✕</button>
    <div class="mgrid">
      <div class="mimg"><img src="${imgUrl(i.img, 900)}" onerror="onImgErr(this,'${i.img}')" alt="${esc(i.name)}"></div>
      <div class="minfo">
        <div class="code">${esc(i.code)}</div>
        <h2>${esc(i.name)}</h2>
        <div class="prices">
          <span class="p-main" style="font-size:26px">${money(i.price)}</span><span class="p-cur">${cur()} / ${esc(i.unit)}</span>
          <span class="p-sub">سعر الجملة</span>
        </div>
        <div>
          <div class="spec"><span>القسم</span><b>${esc(i.cat)}</b></div>
          <div class="spec"><span>وحدة البيع</span><b>${esc(i.unit)}</b></div>
          ${i.pcs ? `<div class="spec"><span>عدد الحبات بالكرتون</span><b>${i.pcs}</b></div>
                     <div class="spec"><span>سعر الكرتون</span><b>${money(i.ctn)} ${cur()}</b></div>` : ''}
          ${showStock ? `<div class="spec"><span>المتوفر</span><b>${i.stock} ${esc(i.unit)} (الرئيسي ${i.s01} · فرع02 ${i.s02} · فرع05 ${i.s05})</b></div>`
                      : `<div class="spec"><span>الحالة</span><b style="color:${i.stock > 0 ? 'var(--green)' : 'var(--red)'}">${i.stock > 0 ? 'متوفر' : 'غير متوفر حالياً'}</b></div>`}
          ${i.note ? `<div class="spec"><span>ملاحظة</span><b>${esc(i.note)}</b></div>` : ''}
        </div>
        <div class="qbtns">
          <button class="qb" onclick="mq(3)">3</button>
          <button class="qb" onclick="mq(6)">6</button>
          <button class="qb" onclick="mq(12)">12</button>
          <button class="qb ctn ${i.pcs ? '' : 'off'}" onclick="${i.pcs ? `mq(${i.pcs})` : `toast('لم يُحدَّد عدد الحبات بالكرتون')`}">كرتون</button>
        </div>
        <div class="addrow">
          <input class="qty-in" id="mQty" type="number" min="1" value="${cart[i.code] ? cart[i.code].qty : 1}">
          <button class="add" onclick="addToCart('${esc(i.code)}', Math.max(1,+document.getElementById('mQty').value||1)); closeModal();">أضف للسلة</button>
        </div>
        <button class="ghost" onclick="shareItem('${esc(i.code)}')">🔗 نسخ رابط الصنف</button>
      </div>
    </div>`;
  document.getElementById('modal').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function mq(v) { document.getElementById('mQty').value = v; }
function closeModal() {
  document.getElementById('modal').classList.remove('on');
  if (!document.querySelector('.drawer.on')) document.getElementById('scrim').classList.remove('on');
}
function shareItem(code) {
  const u = location.origin + location.pathname + '?item=' + encodeURIComponent(code);
  navigator.clipboard.writeText(u).then(() => toast('تم نسخ الرابط ✓'));
}

/* ---------- درج المفضلة ---------- */
function renderFav() {
  const a = ITEMS.filter(i => favs.includes(i.code));
  document.getElementById('favBody').innerHTML = a.length
    ? a.map(i => `<div class="ci"><img src="${imgUrl(i.img,120)}" onerror="onImgErr(this,'${i.img}')" alt="">
        <div class="m"><div class="n">${esc(i.name)}</div><div class="c">${esc(i.code)} · ${money(i.price)} ${cur()}</div>
        <button class="qb" style="margin-top:6px;padding:5px 12px" onclick="addToCart('${esc(i.code)}',1)">أضف للسلة</button></div>
        <div class="t"><button class="rm" onclick="toggleFav('${esc(i.code)}');renderFav()">✕</button></div></div>`).join('')
    : `<div class="state"><div class="em">♡</div><b>لا توجد مفضلة</b>اضغط ♡ على أي صنف</div>`;
}

/* ---------- طلب سريع بالأكواد ---------- */
function quickOrder() {
  const raw = prompt('الصق أكواد الأصناف (كل كود بسطر، أو: كود=الكمية)\nمثال:\n800-02122=12\n500-00302=3');
  if (!raw) return;
  let ok = 0, bad = [];
  raw.split(/[\n,،]+/).forEach(line => {
    const p = line.split(/[=\s:]+/).filter(Boolean);
    if (!p.length) return;
    const it = ITEMS.find(x => x.code.toLowerCase() === p[0].trim().toLowerCase());
    if (it) { cart[it.code] = { qty: Math.max(1, parseInt(p[1]) || 1) }; ok++; }
    else bad.push(p[0]);
  });
  save('smiling_cart', cart); updBadges(); refreshCardStates(); renderCart(); openDrawer('cart');
  toast(`أُضيف ${ok} صنف${bad.length ? ' — لم يُعثر على: ' + bad.join(', ') : ''}`);
}

/* ---------- الأدراج والتنبيهات ---------- */
function openDrawer(id) {
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeAll() {
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('on'));
  document.getElementById('modal').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
let toastT;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#123FA6;color:#fff;padding:11px 20px;border-radius:12px;z-index:200;font-size:14px;box-shadow:0 8px 30px rgba(19,36,65,.35);max-width:90vw;text-align:center;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = '0', 2200);
}

function deepLink() {
  const p = new URLSearchParams(location.search);
  if (p.get('cat')) setCat(p.get('cat'));
  if (p.get('item')) openItem(p.get('item'));
}

/* ---------- الأحداث ---------- */
let qT;
document.getElementById('q').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { f.q = e.target.value; render(); }, 220); };
document.getElementById('fCatSel').onchange = e => setCat(e.target.value);
document.getElementById('fPrice').onchange = e => { f.price = e.target.value; render(); };
document.getElementById('fSort').onchange = e => { f.sort = e.target.value; render(); };
document.getElementById('fView').onclick = e => {
  f.list = !f.list; e.target.classList.toggle('on', f.list);
  e.target.textContent = f.list ? '▦ شبكة' : '☰ قائمة'; render();
};
document.getElementById('btnQuick').onclick = quickOrder;
document.getElementById('btnMenu').onclick = () => { renderNav(); openDrawer('menu'); };
document.getElementById('menuClose').onclick = closeAll;
document.getElementById('btnCart').onclick = () => { renderCart(); openDrawer('cart'); };
document.getElementById('btnFav').onclick = () => { renderFav(); openDrawer('fav'); };
document.getElementById('cartClose').onclick = closeAll;
document.getElementById('favClose').onclick = closeAll;
document.getElementById('scrim').onclick = closeAll;
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* سحب شريط الأقسام العلوي */
dragScroll(document.getElementById('cats'));

/* زر العودة لأعلى */
const toTop = document.getElementById('toTop');
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
addEventListener('scroll', () => toTop.classList.toggle('on', scrollY > 500), { passive: true });

updBadges();
boot();
</script>
</body>
